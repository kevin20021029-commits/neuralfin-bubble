<body>
  <main class="nf-phone" aria-label="NeuralFin app prototype">
    <div class="nf-screen">
      <header class="status">
        <span>10:48</span>
        <span class="status-icons">
          <svg width="11" height="9" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a12 12 0 0 1 16 0M7.5 15.5a7 7 0 0 1 9 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <svg width="11" height="9" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9a14 14 0 0 1 18 0M6.5 13a9 9 0 0 1 11 0M10 16.7a4 4 0 0 1 4 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span class="battery"><span class="battery-box"></span><span>90</span></span>
        </span>
      </header>
      <header class="top">
        <button id="nf-logo" class="logo" type="button" aria-label="Open profile"><img id="nf-logo-image" alt="NeuralFin logo"></button>
        <nav id="nf-tabs" class="tabs" aria-label="Main navigation">
          <button class="tab active" data-tab="follow" type="button">&#x5173;&#x6CE8;</button>
          <button class="tab" data-tab="featured" type="button">&#x7CBE;&#x9009;</button>
          <button class="tab" data-tab="discover" type="button">&#x53D1;&#x73B0;</button>
          <button class="tab" data-tab="hot" type="button">&#x70ED;&#x641C;</button>
          <button class="tab" data-tab="podcast" type="button">&#x64AD;&#x5BA2;</button>
          <button class="tab" data-tab="news" type="button">&#x8D44;&#x8BAF;</button>
        </nav>
        <button class="search" type="button" aria-label="Search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="#8a9088" stroke-width="2"/><path d="M20 20l-3.7-3.7" stroke="#8a9088" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <main id="nf-main" class="main">
        <section id="nf-page-follow" class="page active" data-page="follow">
          <div id="nf-follow-grid" class="masonry"></div>
        </section>
        <section id="nf-page-featured" class="page" data-page="featured">
          <div id="nf-featured-content"></div>
        </section>

  <script>
    (function(){
      "use strict";
      const $ = id => document.getElementById(id);
      const SECTOR_NAMES = {macro:"\u5b8f\u89c2",us:"\u7f8e\u80a1",hk:"\u6e2f\u80a1",crypto:"\u52a0\u5bc6",com:"\u5546\u54c1"};
      const BADGE_NAMES = {bo:"\u7206",hot:"\u70ed",new:"\u65b0",up:"\u5347",down:"\u964d"};
      const state = {tab:"follow",view:"list",sector:"all",topic:null,followed:new Set(),closeTimer:0};
      const emit = (type,detail) => document.dispatchEvent(new CustomEvent(type,{detail}));
      const asset = key => key && window.NF_ASSETS ? window.NF_ASSETS[key] : "";
      const el = (tag,cls,text) => {const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n;};
      const image = (key,cls,alt) => {const n=el("img",cls||""); n.src=asset(key)||""; n.alt=alt||key||""; n.loading="lazy"; return n;};
      const formatNumber = value => Number(value||0).toLocaleString("en-US");
      const formatCompact = value => {const n=Number(value||0); return n>=10000 ? (n/10000).toFixed(1).replace(/\.0$/,"")+"\u4e07" : formatNumber(n);};
      const comments = topic => topic.posts.reduce((sum,p)=>sum+(Number(p.cmts)||0),0);
      function author(key){return window.NF_FEEDS.authors[key]||{name:key,avatar:""};}
      function avatarNode(key,size){const a=author(key); let node; if(a.avatar&&asset(a.avatar))node=image(a.avatar,"avatar",a.name); else{node=el("span","avatar",String(a.name||"N").slice(0,1)); const hue=(a.name||"N").charCodeAt(0)*7%360; node.style.background=`linear-gradient(135deg,hsl(${hue} 72% 56%),hsl(${hue+38} 68% 43%))`;} node.style.width=(size||20)+"px"; node.style.height=(size||20)+"px"; if(size>=24)node.style.fontSize=Math.round(size*.38)+"px"; return node;}
      function coverNode(key,height){const wrap=el("div","cover"+(key&&asset(key)?" play":" placeholder")); if(key&&asset(key))wrap.appendChild(image(key,"","")); wrap.style.height=(height||240)+"px"; return wrap;}
      function renderFeed(items,root){root.replaceChildren(); items.forEach(item=>{const card=el("article","card"); card.append(coverNode(item.cover,240)); const body=el("div","card-body"); body.append(el("h3","card-title",item.title)); const row=el("div","author-row"); row.append(avatarNode(item.author,20),el("span","author-name",author(item.author).name),el("span","like","\u2661 "+formatNumber(item.likes))); body.append(row); card.append(body); root.appendChild(card);});}
      function renderFeatured(){const root=$("nf-featured-content"); const data=window.NF_FEEDS.featured; root.replaceChildren(); const banner=el("div","banner nf-banner"); const track=el("div","nf-banner-track"); ["banner_nbti","col_daguo","col_aiglasses"].forEach(k=>track.appendChild(image(k,"",""))); banner.appendChild(track); const cta=el("button","banner-cta",data.banner.cta); banner.append(cta,el("div","banner-pips")); Array.from({length:data.banner.dots}).forEach((_,i)=>banner.lastChild.appendChild(el("i","banner-dot"+(i===data.banner.active?" active":"")))); root.appendChild(banner); root.appendChild(el("h2","section-title","\u4e13\u680f")); data.sections.forEach(sec=>{const card=el("article","column-card"); const cover=el("div","column-cover"); cover.appendChild(image(sec.cover,"","")); cover.appendChild(el("span","column-overlay",sec.overlay)); const meta=el("div","column-meta"); meta.append(el("h3","column-title",sec.title),el("p","column-count",sec.count)); cover.appendChild(meta); card.appendChild(cover); const body=el("div","column-body"); const row=el("div","column-author"); row.append(avatarNode(sec.author,28),el("span","author-name",author(sec.author).name),el("button","follow-btn",sec.action)); body.appendChild(row); card.appendChild(body); root.appendChild(card);});}
      function renderDiscover(){const chips=$("nf-discover-chips"),grid=$("nf-discover-grid"),data=window.NF_FEEDS.discover; chips.replaceChildren(); data.chips.forEach(chip=>{const b=el("button","chip"+(chip.active?" active":""),chip.label); b.dataset.chip=chip.id; b.addEventListener("click",()=>{chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("active")); b.classList.add("active");}); chips.appendChild(b);}); renderFeed(data.items,grid);}
      function renderPodcast(){const root=$("nf-podcast-content"),data=window.NF_FEEDS.podcast; root.replaceChildren(); const hero=el("article","podcast-hero"); hero.append(image(data.hero.image,"",""),el("div","podcast-hero-gradient")); const text=el("div","podcast-hero-text"); text.append(el("h2","podcast-title",data.hero.title),el("p","podcast-meta",data.hero.meta)); hero.appendChild(text); root.appendChild(hero); root.appendChild(el("h2","section-title",data.title)); data.episodes.forEach(ep=>{const row=el("article","episode"); const pic=el("div","episode-image"); pic.appendChild(image(ep.image,"","")); const main=el("div"); main.style.flex="1"; main.append(el("h3","episode-title",ep.title),el("p","episode-meta",ep.meta)); row.append(pic,main,el("button","play-btn nf-play-btn","\u25b6")); root.appendChild(row);});}
      function renderNews(){const chips=$("nf-news-chips"),root=$("nf-news-content"),data=window.NF_FEEDS.news; chips.replaceChildren(); const date=el("div"); date.append(el("span","date-box",data.day),el("span","date-label",data.dayLabel)); chips.appendChild(date); data.chips.forEach(chip=>{const b=el("button","news-chip"+(chip.active?" active":""),chip.label); b.dataset.newsChip=chip.id; b.addEventListener("click",()=>{chips.querySelectorAll(".news-chip").forEach(x=>x.classList.remove("active")); b.classList.add("active");}); chips.appendChild(b);}); root.replaceChildren(); data.items.forEach(item=>{const li=el("article","news-item"); li.append(el("span","news-time",item.time),el("p","news-text",item.text)); root.appendChild(li);});}
      function renderProfile(){const data=window.NF_FEEDS.profile; $("nf-logo-image").src=asset("logo_n")||""; $("nf-assistant-image").src=asset("bubble_sprite")||""; $("nf-profile-avatar").src=asset("avatar_trends")||""; $("nf-profile-name").textContent=data.name; $("nf-profile-handle").textContent=data.handle; $("nf-profile-points").textContent="\u2726 "+data.points; $("nf-manage-btn").textContent=data.button; $("nf-profile-all").textContent=data.filter; const stats=$("nf-profile-stats"); stats.replaceChildren(); data.stats.forEach(item=>{const box=el("div","profile-stat"); box.append(el("b",undefined,item.value),el("span",undefined,item.label)); stats.appendChild(box);}); const tabs=$("nf-profile-tabs"); tabs.replaceChildren(); data.tabs.forEach((label,i)=>{const b=el("button","profile-tab"+(i?"":" active"),label); b.addEventListener("click",()=>{tabs.querySelectorAll(".profile-tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");}); tabs.appendChild(b);}); const grid=$("nf-profile-posts"); grid.replaceChildren(); data.posts.forEach(post=>{const card=el("article","card"); const cover=el("div","cover"); cover.appendChild(image(post.image,"","")); cover.style.height="150px"; card.appendChild(cover); const body=el("div","card-body"); body.append(el("h3","card-title",post.title)); const row=el("div","author-row"); row.append(avatarNode(post.author,20),el("span","author-name",author(post.author).name),el("span","like","\u2661 "+post.likes)); body.appendChild(row); card.appendChild(body); grid.appendChild(card);});}
      function setTab(tab,notify){const tabs=document.querySelectorAll("#nf-tabs .tab"); const pages=document.querySelectorAll(".page"); let valid=false; tabs.forEach(b=>{const active=b.dataset.tab===tab; b.classList.toggle("active",active); if(active)valid=true;}); pages.forEach(p=>p.classList.toggle("active",p.dataset.page===tab)); if(!valid)return; if(state.tab!==tab){state.tab=tab; if(notify!==false)emit("nf:tab-change",{to:tab});} if(tab==="hot"&&state.view==="bubbles")requestAnimationFrame(()=>emit("nf:view-change",{to:"bubbles"}));}
      function openProfile(){const p=$("nf-profile"); p.classList.add("open"); p.setAttribute("aria-hidden","false"); emit("nf:open-profile",{});}
      function closeProfile(){const p=$("nf-profile"); if(!p.classList.contains("open"))return; p.classList.remove("open"); p.setAttribute("aria-hidden","true"); emit("nf:close-profile",{});}
      function renderLeaderboard(sector){if(typeof sector==="string")state.sector=sector; const topics=window.NF_DATA.topics.filter(t=>state.sector==="all"||t.sector===state.sector).sort((a,b)=>a.rank-b.rank); const root=$("nf-leaderboard"); root.replaceChildren(); topics.forEach(topic=>{const item=el("button","nf-rank-item"); item.type="button"; item.dataset.topicId=topic.id; item.style.setProperty("--sector-color",`var(--sec-${topic.sector})`); item.setAttribute("aria-label",topic.rank+" "+topic.title); const rank=el("span","nf-rank"+(topic.rank<=3?" top":""),String(topic.rank)); const main=el("div"); const badges=el("div","nf-badge-row"); badges.append(el("span","nf-badge "+topic.badge,BADGE_NAMES[topic.badge]||"\u70ed"),el("span","nf-sector",SECTOR_NAMES[topic.sector]||"\u91d1\u878d")); main.append(badges,el("div","nf-topic-title",topic.title),el("div","nf-topic-meta",formatCompact(topic.heat)+"\u70ed\u5ea6 \u00b7 "+formatNumber(comments(topic))+"\u8ba8\u8bba")); const side=el("div"); side.style.textAlign="right"; side.append(el("div","nf-heat","\ud83d\udd25 "+formatNumber(topic.heat)),el("span","nf-arrow","\u203a")); item.append(rank,main,side); item.addEventListener("click",()=>emit("nf:open-topic",{id:topic.id})); root.appendChild(item);});}
      function renderPost(post,topic){const card=el("article","post"); card.style.setProperty("--sector-color",`var(--sec-${topic.sector})`); if(post.type==="text"){card.appendChild(el("div","post-cover text-cover"));}else{const cover=el("div","post-cover"); cover.append(el("span",undefined,post.type==="video"?"\u25b6":"\ud83d\uddbc"),el("span","cover-tag",post.type==="video"?"\u89c6\u9891":"\u56fe\u7247")); card.appendChild(cover);} const body=el("div","post-body"); body.append(el("h3","post-title",post.title),el("p","post-text",post.body)); if(post.ticker){const row=el("div","ticker"); const left=el("span"); left.append(el("strong",undefined,post.ticker.code),el("span","ticker-name"," "+post.ticker.name)); const value=parseFloat(post.ticker.chg); const cls=Number.isNaN(value)?"chg-flat":value>=0?"chg-up":"chg-down"; row.append(left,el("span",cls,post.ticker.chg)); body.appendChild(row);} const foot=el("div","post-footer"); const av=avatarNode(post.author||post.a||"N",19); foot.append(av,el("span","post-author",(post.a||"")+" \u00b7 "+(post.t||"")),el("span","post-count","\u2661"+formatCompact(post.likes)+" \u00b7 "+formatCompact(post.cmts))); body.appendChild(foot); card.appendChild(body); return card;}
      function renderDetail(topic){state.topic=topic; const detail=$("nf-topic-detail"); detail.style.setProperty("--sector-color",`var(--sec-${topic.sector})`); $("nf-detail-rank").textContent="\u70ed\u641c No."+topic.rank+" \u00b7 "+(SECTOR_NAMES[topic.sector]||"\u91d1\u878d"); const badge=$("nf-detail-badge"); badge.textContent=BADGE_NAMES[topic.badge]||"\u70ed"; badge.className="nf-badge "+topic.badge; $("nf-detail-title").textContent=topic.title; $("nf-detail-brief").textContent=topic.brief; $("nf-detail-stats").textContent=formatCompact(topic.heat)+"\u70ed\u5ea6 \u00b7 "+formatNumber(comments(topic))+"\u8ba8\u8bba"; const followed=state.followed.has(topic.id),fb=$("nf-follow-btn"); fb.textContent=followed?"\u5df2\u5173\u6ce8":"+ \u5173\u6ce8"; fb.classList.toggle("followed",followed); const cols=[$("nf-post-col-1"),$("nf-post-col-2")]; cols.forEach(c=>c.replaceChildren()); topic.posts.forEach((post,i)=>cols[i%2].appendChild(renderPost(post,topic)));}
      function openTopic(id){const topic=window.NF_DATA.topics.find(t=>t.id===id); if(!topic)return; clearTimeout(state.closeTimer); const detail=$("nf-topic-detail"); detail.classList.remove("closing"); detail.classList.add("open"); detail.setAttribute("aria-hidden","false"); renderDetail(topic); detail.scrollTop=0;}
      function closeTopic(){const detail=$("nf-topic-detail"); if(!detail.classList.contains("open")||detail.classList.contains("closing"))return; emit("nf:close-topic",{}); detail.classList.add("closing"); detail.setAttribute("aria-hidden","true"); state.closeTimer=window.setTimeout(()=>detail.classList.remove("open","closing"),220);}
      function setView(view){if(state.view===view)return; state.view=view; const seg=$("nf-view-seg"); seg.dataset.current=view; seg.querySelectorAll(".nf-seg-btn").forEach(b=>{const active=b.dataset.view===view; b.classList.toggle("active",active); b.setAttribute("aria-pressed",String(active));}); $("nf-list-view").hidden=view!=="list"; const bv=$("nf-bubble-view"); bv.hidden=view!=="bubbles"; bv.classList.toggle("active",view==="bubbles"); emit("nf:view-change",{to:view});}
      function setSector(sector){if(state.sector===sector)return; state.sector=sector; document.querySelectorAll("#nf-sector-chips .chip").forEach(b=>{const active=b.dataset.sector===sector; b.classList.toggle("active",active); b.setAttribute("aria-pressed",String(active));}); renderLeaderboard(sector); emit("nf:filter-change",{sector});}
      function renderHotChips(){const root=$("nf-sector-chips"); root.replaceChildren(); [["all","\u5168\u90e8"],["macro","\u5b8f\u89c2"],["us","\u7f8e\u80a1"],["hk","\u6e2f\u80a1"],["crypto","\u52a0\u5bc6"],["com","\u5546\u54c1"]].forEach(([id,label],i)=>{const b=el("button","chip"+(i?"":" active"),label); b.dataset.sector=id; b.setAttribute("aria-pressed",String(!i)); b.addEventListener("click",()=>setSector(id)); root.appendChild(b);});}
      function bindApp(){document.querySelectorAll("#nf-tabs .tab").forEach(tab=>tab.addEventListener("click",()=>setTab(tab.dataset.tab,true))); $("nf-logo").addEventListener("click",openProfile); document.querySelector(".profile-close").addEventListener("click",closeProfile); document.querySelectorAll("#nf-view-seg .nf-seg-btn").forEach(btn=>btn.addEventListener("click",()=>setView(btn.dataset.view))); document.addEventListener("nf:open-topic",event=>openTopic(String(event.detail&&event.detail.id||""))); document.querySelector(".nf-detail-close").addEventListener("click",closeTopic); $("nf-follow-btn").addEventListener("click",()=>{if(!state.topic)return; const followed=!state.followed.has(state.topic.id); if(followed)state.followed.add(state.topic.id); else state.followed.delete(state.topic.id); const b=$("nf-follow-btn"); b.textContent=followed?"\u5df2\u5173\u6ce8":"+ \u5173\u6ce8"; b.classList.toggle("followed",followed);}); document.addEventListener("keydown",event=>{if(event.key==="Escape")closeTopic();}); document.querySelectorAll("#nf-dock .dock-item").forEach(item=>item.addEventListener("click",()=>{document.querySelectorAll("#nf-dock .dock-item").forEach(x=>x.classList.remove("active")); item.classList.add("active");}));}
      function init(){renderProfile(); renderFeed(window.NF_FEEDS.follow,$("nf-follow-grid")); renderFeatured(); renderDiscover(); renderPodcast(); renderNews(); renderHotChips(); renderLeaderboard("all"); bindApp(); const time=(window.NF_META.updatedAt||"").split(" ")[1]||"09:45"; $("nf-hot-updated").textContent=time; $("nf-list-time").textContent="\u66f4\u65b0\u4e8e "+time; $("nf-hot-sub").textContent=window.NF_META.source; window.NF_APP=Object.assign(window.NF_APP||{},{openTopic,renderLeaderboard,renderDetail}); setTab("follow",false);}
      init();
    })();
  </script>
</body>
</html>
